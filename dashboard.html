<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>War Room OS V9.7 — Limited-Production Trading Control Plane</title>
<style>
:root{--bg:#050811;--panel:#0a1020;--panel2:#0d1629;--line:#20304c;--text:#d9e6f5;--muted:#8192aa;--faint:#53647e;--cyan:#53d8ff;--green:#3df09a;--amber:#ffd166;--red:#ff6688;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;--sans:Inter,Segoe UI,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#0a1830 0,#050811 42%);color:var(--text);font-family:var(--sans)}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:rgba(5,8,17,.96);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:4px 8px 18px}.brand h1{margin:0;font:900 18px var(--mono);letter-spacing:.08em}.brand b{color:var(--cyan)}.brand p{margin:7px 0 0;color:var(--muted);font-size:11px;line-height:1.5}.nav{display:grid;gap:5px}.nav button{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--muted);padding:10px;border-radius:8px;font:700 11px var(--mono);cursor:pointer}.nav button:hover,.nav button.active{background:var(--panel2);border-color:var(--line);color:var(--text)}
.main{padding:16px 18px 40px;min-width:0}.top{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:rgba(9,15,29,.88);padding:12px 14px;border-radius:10px;position:sticky;top:8px;z-index:10;backdrop-filter:blur(12px)}.title{font:900 14px var(--mono)}.chip{margin-left:auto;border:1px solid var(--line);padding:6px 9px;border-radius:999px;font:700 10px var(--mono);color:var(--amber)}
.hero{display:grid;grid-template-columns:1.7fr 1fr;gap:12px;margin-top:12px}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(13,22,41,.94),rgba(8,13,25,.96));border-radius:10px;padding:15px;min-width:0}.eyebrow{font:800 9px var(--mono);letter-spacing:.14em;color:var(--faint)}h2{margin:7px 0 8px;font:900 22px var(--sans)}.lead{color:var(--muted);font-size:13px;line-height:1.6}.status{font:900 20px var(--mono);color:var(--amber)}.bad{color:var(--red)}.good{color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.market{border-left:4px solid var(--faint)}.market.ready{border-left-color:var(--green)}.market.partial{border-left-color:var(--amber)}.market h3{margin:6px 0 4px;font-size:15px}.rows{display:grid;gap:7px;margin-top:12px}.row{display:grid;grid-template-columns:1.2fr .65fr 2fr;gap:10px;align-items:start;padding:9px;border:1px solid #182844;border-radius:7px;background:#080e1b}.row .name{font:700 11px var(--mono)}.row .state{font:800 10px var(--mono);color:var(--amber)}.row .note{font-size:11px;color:var(--muted);line-height:1.45}.section{margin-top:12px}.section h3{margin:0 0 10px;font:800 13px var(--mono)}.list{display:grid;gap:8px}.item{border:1px solid #182844;background:#080e1b;border-radius:8px;padding:11px}.item b{font:800 11px var(--mono)}.item p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.audit{width:100%;border-collapse:collapse;font-size:11px}.audit th,.audit td{border-bottom:1px solid #182844;padding:9px;text-align:left;vertical-align:top}.audit th{color:var(--faint);font:800 9px var(--mono);letter-spacing:.08em}.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:8px}.foot{margin-top:16px;color:var(--faint);font:10px var(--mono);line-height:1.6}
@media(max-width:980px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,1fr)}.hero,.grid{grid-template-columns:1fr}.top{position:relative;top:0}}
</style>
</head>
<body><script>/*__INJECT_DATA__*/</script>
<div class="app">
<aside class="side"><div class="brand"><h1>WAR ROOM <b>V9.7</b></h1><p>Projection berbasis ekonomi, fundamental, ekspektasi, flow, positioning, bottleneck, dan transmisi kausal.</p></div><nav class="nav" id="nav"></nav></aside>
<main class="main"><div class="top"><div class="title" id="pageTitle">MISSION CONTROL</div><div class="chip" id="sync">MEMUAT DATA</div></div><div id="content"></div></main>
</div>
<script>
const TABS=[
 ['mission','Mission Control'],['macro','Macro & Regime'],['integrity','Data Integrity & Reality'],['liquidity','Liquidity / Credit / Policy'],
 ['warning','Early Warning'],['alpha','Alpha Center'],['execution','Execution Control'],['us','US Stocks'],['idx','IHSG'],['crypto','Crypto'],['commodity','Commodities'],['fx','FX'],
 ['flow','Flow & Positioning'],['causal','Causal Chain & Bottlenecks'],['projection','Price Projection'],['validation','Validation']
];
let D=window.DASHBOARD_DATA||{};let active='mission';
const esc=x=>String(x??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const obj=x=>(x&&typeof x==='object'&&!Array.isArray(x))?x:{};
const arr=x=>Array.isArray(x)?x:[];
function stateClass(s){s=String(s||'').toUpperCase();if(/READY|APPROVED|OBSERVED_RELEASE_LAGGED/.test(s))return'good';if(/BLOCK|NO_DATA|INCOMPLETE|NO_PROJECTION/.test(s))return'bad';return''}
function nav(){document.getElementById('nav').innerHTML=TABS.map(([id,label])=>`<button data-id="${id}" class="${id===active?'active':''}">${label}</button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{active=b.dataset.id;nav();render();});}
function evidenceRows(m){const ev=obj(m.evidence_domains);const rows=Object.entries(ev);if(!rows.length)return'<div class="empty">Belum ada domain data yang dimuat.</div>';return`<div class="rows">${rows.map(([k,v])=>`<div class="row"><div class="name">${esc(k.replaceAll('_',' ').toUpperCase())}</div><div class="state ${stateClass(v.state)}">${esc(v.state)}</div><div class="note">${esc(v.note||'')}<br><span style="color:var(--faint)">${esc(v.source||'')}</span></div></div>`).join('')}</div>`}
function marketCard(id){const m=obj(obj(D.markets)[id]),k=obj(obj(obj(D.research_kernel).markets)[id]),p=obj(k.projection);const ready=Number(m.point_in_time_domains_ready||0);const cls=ready>1?'ready':ready?'partial':'';const methods=arr(k.projection_methods);return`<div class="card market ${cls}"><div class="eyebrow">${esc(m.label||id.toUpperCase())}</div><h3>${esc(p.status||m.projection_status||'NO_PROVEN_PROJECTION')}</h3><div class="lead">${esc(m.decision_reason||p.claim||'Data dan proof belum lengkap.')}</div><div class="item" style="margin-top:10px"><b>CARA TARGET DIHITUNG</b><p>${methods.length?methods.map(x=>esc(x.replaceAll('_',' '))).join(' · '):'Belum dipetakan'}</p></div><div class="status ${stateClass(m.capital_permission)}" style="font-size:13px;margin-top:10px">CAPITAL: ${esc(m.capital_permission||'BLOCKED')}</div>${evidenceRows(m)}</div>`}
function header(title,desc){const ps=obj(D.proof_status),tr=obj(D.v97_trading_readiness);return`<div class="hero"><div class="card"><div class="eyebrow">${esc(title)}</div><h2>${esc(desc)}</h2><div class="lead">V9.7 memisahkan tiga hal: kualitas riset, kesiapan kontrol eksekusi, dan izin order. Quote hanya referensi eksekusi; order hanya dapat diekspor setelah proof exact-scope, risk gate, dan persetujuan manusia lulus.</div></div><div class="card"><div class="eyebrow">STATUS PENGGUNAAN</div><div class="status ${stateClass(ps.capital_permission)}">${esc(ps.capital_permission||'BLOCKED')}</div><div class="lead" style="margin-top:8px">Control plane: ${esc(tr.software_state||ps.operational_permission||'INCOMPLETE')} · Bound proof: ${esc(tr.bound_proof_markets||0)}/5 · Auto-submit: NO</div></div></div>`}
function mission(){const v=obj(D.v97_status),rs=obj(D.v96_research_status),ps=obj(D.proof_status),tr=obj(D.v97_trading_readiness),q=obj(D.v97_execution_quotes);return header('MISSION CONTROL','Sistem operasional untuk limited-production—tanpa menganggap software sebagai alpha')+`<div class="card section"><div class="eyebrow">V9.7 TRADING READINESS</div><h3>${esc(v.release_state||tr.software_state||'LIMITED-PRODUCTION CONTROL PLANE')}</h3><div class="lead">${esc(v.human_summary||'Quote freshness, sizing, pre-trade limits, human approval, kill switch, order export, dan fill reconciliation tersedia. Tanpa proof yang sah, hasil akhirnya tetap NO TRADE.')}</div><table class="audit"><tbody><tr><td>Frozen causal mapping</td><td>${esc(v.causal_mapping_ready_markets??5)}/5</td></tr><tr><td>Anti-overfit research infrastructure</td><td>${esc(v.research_infrastructure_ready_markets??5)}/5</td></tr><tr><td>Limited-production control plane</td><td>${esc(tr.operational_control_plane_ready_markets??0)}/5</td></tr><tr><td>Market dengan current execution quote</td><td>${esc(tr.current_execution_quote_markets??q.markets_with_quote??0)}/5</td></tr><tr><td>Bound exact-scope proof</td><td>${esc(tr.bound_proof_markets??0)}/5</td></tr><tr><td>Historical statistical pass</td><td>${esc(rs.historical_statistical_pass_markets??0)}/5</td></tr><tr><td>Historical blind-proven</td><td>${esc(rs.historical_blind_proven_markets??0)}/5</td></tr><tr><td>Order auto-submit</td><td>DISABLED</td></tr><tr><td>Technical predictors</td><td>${esc(v.technical_predictors??0)}</td></tr></tbody></table><div class="status ${stateClass(ps.capital_permission)}" style="font-size:13px;margin-top:10px">CAPITAL: ${esc(ps.capital_permission||'BLOCKED')}</div></div><div class="grid">${['us','idx','crypto','commodity','fx'].map(marketCard).join('')}</div>`}
function macro(){const rows=Object.entries(obj(D.macro_observations));return header('MACRO & REGIME','Kondisi ekonomi yang sedang teramati')+`<div class="card section"><h3>OBSERVASI EKONOMI</h3>${rows.length?`<table class="audit"><thead><tr><th>SERIES</th><th>NILAI</th><th>OBSERVATION</th><th>STATUS PIT</th></tr></thead><tbody>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v.value)}</td><td>${esc(v.observation_timestamp)}</td><td>${v.point_in_time_eligible?'ELIGIBLE':'CURRENT VINTAGE ONLY'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Macro data belum tersedia.</div>'}</div>`}
function integrity(){const src=arr(obj(D.data_health).sources);return header('DATA INTEGRITY & REALITY','Data yang ada belum otomatis menjadi bukti trading')+`<div class="card section"><h3>SOURCE LEDGER</h3>${src.length?`<table class="audit"><thead><tr><th>PROVIDER</th><th>DATASET</th><th>STATE</th><th>CLAIM LIMIT</th></tr></thead><tbody>${src.map(x=>`<tr><td>${esc(x.provider)}</td><td>${esc(x.dataset)}</td><td>${esc(x.state)}</td><td>${esc(x.note)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Source ledger kosong.</div>'}</div>`}
function liquidity(){return header('LIQUIDITY / CREDIT / POLICY','Baca sumber likuiditas dan transmisi kebijakan, bukan pola chart')+`<div class="grid">${marketCard('us')}${marketCard('fx')}</div>`}
function warning(){return header('EARLY WARNING','Peringatan harus berasal dari deteriorasi ekonomi, kredit, likuiditas, atau physical market')+`<div class="card section"><div class="empty">Belum ada early-warning model yang lulus proof gate.</div></div>`}
function pct(x){return Number.isFinite(Number(x))?(Number(x)*100).toFixed(2)+'%':'—'}
function alpha(){const v=obj(D.v96_status),rs=obj(D.v96_research_status);return header('ALPHA CENTER','Kandidat hanya naik kelas setelah menang melawan baseline dan bertahan di data yang tidak disentuh')+`<div class="card section"><div class="eyebrow">V9.6 ANTI-OVERFIT FIREWALL</div><h3>${esc(v.alpha_state||'NO PROMOTED ALPHA')}</h3><div class="lead">Semua trial—termasuk yang gagal—harus tercatat. Kandidat dipilih sebelum lockbox, lalu diuji dengan purged walk-forward, PBO, Deflated Sharpe, familywise bootstrap/Holm, cost stress, regime consistency, parameter-neighbourhood stability, dan P&amp;L concentration.</div><table class="audit"><tbody><tr><td>Mapping sebelum formula</td><td>ENFORCED</td></tr><tr><td>Complete trial-family accounting</td><td>ENFORCED</td></tr><tr><td>Selection frozen before lockbox</td><td>ENFORCED</td></tr><tr><td>Purged walk-forward + embargo</td><td>ENFORCED</td></tr><tr><td>PBO / DSR / multiple-testing control</td><td>ENFORCED</td></tr><tr><td>Parameter spike / lucky-period rejection</td><td>ENFORCED</td></tr><tr><td>Historical blind-proven markets</td><td>${esc(rs.historical_blind_proven_markets??0)}/5</td></tr><tr><td>Live promoted modules</td><td>0/5</td></tr></tbody></table><div class="status bad" style="margin-top:12px">CAPITAL: BLOCKED · FIXTURE PASS ≠ MARKET PROOF</div></div>`}
function market(id){return header((obj(obj(D.markets)[id]).label||id).toUpperCase(),'Status data dan proof untuk market ini')+marketCard(id)}
function execution(){const tr=obj(D.v97_trading_readiness),q=obj(D.v97_execution_quotes),ps=obj(D.proof_status);const markets=obj(tr.markets);return header('EXECUTION CONTROL','Quote → proof binding → sizing → risk limits → human approval → manual export → fill reconciliation')+`<div class="grid"><div class="card"><div class="eyebrow">CONTROL PLANE</div><h3>${esc(tr.software_state||'INCOMPLETE')}</h3><table class="audit"><tbody><tr><td>Operational routes</td><td>${esc(tr.operational_control_plane_ready_markets??0)}/5</td></tr><tr><td>Fresh quote markets</td><td>${esc(tr.current_execution_quote_markets??q.markets_with_quote??0)}/5</td></tr><tr><td>Bound proof markets</td><td>${esc(tr.bound_proof_markets??0)}/5</td></tr><tr><td>Kill switch</td><td>${tr.kill_switch_engaged?'ENGAGED':'CLEAR'}</td></tr><tr><td>Ledger integrity</td><td>${obj(tr.ledger_integrity).valid===true?'VALID':'CHECK'}</td></tr><tr><td>Broker submission</td><td>MANUAL EXPORT ONLY</td></tr></tbody></table></div><div class="card"><div class="eyebrow">ORDER STATE</div><h3>${esc(ps.capital_permission||'BLOCKED')}</h3><div class="list">${['Exact market proof must be hash-bound in component_registry_v97.json','Quote must be current and hash-valid','Entry, stop, target, invalidation and causal chain are mandatory','Position is sized from stop risk and hard portfolio caps','Human HMAC approval expires after 15 minutes','Fill must come from broker/exchange account export and reconcile exactly'].map(x=>`<div class="item"><b>${esc(x)}</b><p>Failure at any step produces BLOCKED / NO TRADE.</p></div>`).join('')}</div></div></div><div class="card section"><h3>MARKET ROUTES</h3><table class="audit"><thead><tr><th>MARKET</th><th>CONTROL PLANE</th><th>QUOTES</th><th>BOUND PROOF</th><th>PERMISSION</th></tr></thead><tbody>${Object.entries(markets).map(([id,row])=>`<tr><td>${esc(id.toUpperCase())}</td><td>${row.operational_control_plane_ready?'READY':'INCOMPLETE'}</td><td>${esc(row.current_quote_count||0)}</td><td>${esc(row.bound_proof_runs||0)}</td><td>${esc(row.capital_permission||'BLOCKED')}</td></tr>`).join('')}</tbody></table></div>`}
function flow(){return header('FLOW & POSITIONING','Flow menjelaskan siapa yang membangun, menutup, atau terpaksa keluar')+`<div class="grid">${marketCard('commodity')}${marketCard('fx')}${marketCard('crypto')}${marketCard('idx')}</div>`}
function causal(){const seq=obj(obj(D.research_kernel).markets);return header('CAUSAL CHAIN & BOTTLENECKS','Origin → transmission → bottleneck → beneficiary → expectations gap → activation clock → amplification → invalidation')+`<div class="card section"><div class="eyebrow">KENAPA BOTTLENECK BELUM TENTU BUY</div><div class="list">${[['STRUCTURAL DORMANT','Bottleneck nyata, tetapi belum ada monetization atau katalis bertanggal.'],['EVIDENCE BUILDING','Order, qualification, guidance, utilization, revisions, atau policy evidence mulai terbentuk.'],['REPRICING READY — RESEARCH ONLY','Causal chain lengkap, expectation gap masih terbuka, supply response terlambat, monetization/katalis aktif, dan low-scenario valuation masih memberi margin.'],['RECOGNIZED / LATE','Thesis mungkin benar, tetapi ekspektasi sudah mengejar.'],['INVALIDATED','Kondisi pembatalan yang dibekukan sudah terjadi.']].map(x=>`<div class="item"><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div>`).join('')}</div></div><div class="grid">${Object.entries(seq).map(([id,k])=>`<div class="card"><div class="eyebrow">${esc(id.toUpperCase())}</div><div class="list">${arr(k.causal_sequence).map((x,i)=>`<div class="item"><b>${i+1}. ${esc(x)}</b><p>${i===0?'Cari sumber perubahan riil.':i===1?'Uji jalur transmisi dan lag.':i===2?'Ukur apa yang belum masuk ekspektasi dan valuation.':'Bekukan activation clock, alternative explanation, dan invalidation.'}</p></div>`).join('')}</div></div>`).join('')}</div>`}
function projectionCard(id){const m=obj(obj(D.markets)[id]),k=obj(obj(obj(D.research_kernel).markets)[id]),p=obj(k.projection),label=m.label||id.toUpperCase();const hasTarget=Number.isFinite(Number(p.base_target));return`<div class="card"><div class="eyebrow">${esc(label)}</div><h3>${esc(p.status||'NO PROVEN PROJECTION')}</h3>${hasTarget?`<table class="audit"><tbody><tr><td>Low</td><td>${esc(p.low_target)}</td></tr><tr><td>Base</td><td>${esc(p.base_target)}</td></tr><tr><td>High</td><td>${esc(p.high_target)}</td></tr><tr><td>Probability-weighted</td><td>${esc(p.expected_target)}</td></tr><tr><td>Horizon</td><td>${esc(p.horizon)}</td></tr></tbody></table><div class="item"><b>ALASAN BOTTLENECK → TARGET</b><p>${esc(p.bottleneck_reason||'—')}</p></div><div class="item"><b>VALUE-CAPTURE BRIDGE</b><p>${esc(p.value_capture_bridge||'—')}</p></div><div class="item"><b>INVALIDATION</b><p>${esc(p.invalidation||'—')}</p></div>`:`<div class="empty">Belum ada target yang boleh ditampilkan. Kalkulator tersedia, tetapi target hanya muncul setelah evidence point-in-time lengkap.</div><div class="item" style="margin-top:10px"><b>METODE YANG DIIZINKAN</b><p>${arr(k.projection_methods).map(x=>esc(x.replaceAll('_',' '))).join(' · ')}</p></div>`}<div class="status bad" style="font-size:13px;margin-top:10px">CAPITAL: BLOCKED</div></div>`}
function projection(){return header('PRICE PROJECTION','Target harus keluar dari value capture atau physical/macro bridge—bukan dari garis harga')+`<div class="card section"><div class="list">${[['LOW SCENARIO','Asumsi konservatif; harus memperhitungkan supply response, dilution, biaya dan kegagalan monetisasi.'],['BASE SCENARIO','Jalur yang paling mungkin menurut evidence point-in-time dan probability calibration.'],['HIGH SCENARIO','Upside bila bottleneck bertahan lebih lama atau value capture melampaui ekspektasi.'],['EXPECTED TARGET','Rata-rata tertimbang probabilitas, bukan janji harga.'],['INVALIDATION','Data nyata yang membatalkan origin, transmission, value capture atau activation clock.']].map(x=>`<div class="item"><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div>`).join('')}</div></div><div class="grid">${['us','idx','commodity','fx','crypto'].map(projectionCard).join('')}</div>`}
function validation(){const ps=obj(D.proof_status),reg=obj(D.proof_registry),v=obj(D.v97_status),rs=obj(D.v96_research_status),tr=obj(D.v97_trading_readiness);return header('VALIDATION','Riset, eksekusi, dan live evidence diuji sebagai lapisan terpisah')+`<div class="card section"><h3>READINESS LADDER</h3><table class="audit"><thead><tr><th>LAPIS</th><th>STATUS</th><th>ARTI</th></tr></thead><tbody><tr><td>Causal maps</td><td>${esc(v.causal_mapping_ready_markets??5)}/5</td><td>Tujuan, transmisi, lineage, horizon, invalidation dan claim limit dibekukan.</td></tr><tr><td>Anti-overfit factory</td><td>${esc(v.research_infrastructure_ready_markets??5)}/5</td><td>Trial ledger, walk-forward, lockbox, PBO/DSR dan stability gate.</td></tr><tr><td>Trading control plane</td><td>${esc(tr.operational_control_plane_ready_markets??0)}/5</td><td>Quote freshness, sizing, limits, approval, kill switch, export dan reconciliation.</td></tr><tr><td>Historical blind proof</td><td>${esc(rs.historical_blind_proven_markets??0)}/5</td><td>Fixture dan backfill tidak dihitung.</td></tr><tr><td>Bound market proof</td><td>${esc(tr.bound_proof_markets??0)}/5</td><td>Proof harus terikat hash pada exact market scope.</td></tr><tr><td>Fully proven live</td><td>${esc(v.fully_proven_markets??0)}/5</td><td>Butuh hasil prospective dan actual fills yang belum dapat dipercepat.</td></tr></tbody></table></div><div class="card section"><h3>PROOF + EXECUTION STATUS</h3><table class="audit"><tbody><tr><td>Final all-market alpha system</td><td>${esc(ps.final_trading_system)}</td></tr><tr><td>Operational software</td><td>${esc(tr.software_state||ps.operational_permission)}</td></tr><tr><td>Capital permission</td><td>${esc(ps.capital_permission||'BLOCKED')}</td></tr><tr><td>Market components promoted</td><td>${esc(ps.predictive_components_promoted||0)} / 5</td></tr><tr><td>Registry version</td><td>${esc(reg.version||'9.7')}</td></tr><tr><td>Auto-submit</td><td>FALSE</td></tr></tbody></table></div><div class="card section"><h3>HARD ORDER GATES</h3><div class="list">${['Proof exact-scope terpasang dan signature-valid','Quote fresh, positive, hash-valid, dan bukan predictor','Entry dekat quote; stop, target, horizon dan invalidation lengkap','Expected return lower bound positif dan reward/risk minimum','Single-trade, market, gross, net, daily-loss, weekly-loss dan drawdown caps','HMAC human approval pada exact input hash','Broker/exchange live fill reconciliation dan immutable hash-chain ledger'].map(x=>`<div class="item"><b>${esc(x)}</b><p>Jika satu saja gagal, order tidak dibuat.</p></div>`).join('')}</div></div>`}
function render(){document.getElementById('pageTitle').textContent=TABS.find(x=>x[0]===active)?.[1]?.toUpperCase()||'WAR ROOM';const f={mission,macro,integrity,liquidity,warning,alpha,us:()=>market('us'),idx:()=>market('idx'),crypto:()=>market('crypto'),commodity:()=>market('commodity'),fx:()=>market('fx'),execution,flow,causal,projection,validation}[active]||mission;document.getElementById('content').innerHTML=f()+`<div class="foot">V9.7 LIMITED-PRODUCTION CONTROL PLANE · MANUAL ORDER EXPORT ONLY · PRICE HANYA UNTUK VALUATION DENOMINATOR, EXECUTION REFERENCE, OUTCOME, DAN RISK MEASUREMENT · GENERATED ${esc(obj(D.meta).generated)}</div>`;document.getElementById('sync').textContent=`${obj(D.data_health).overall||'NO_DATA'} · ${obj(D.proof_status).capital_permission||'BLOCKED'}`;}
async function poll(){try{const r=await fetch('static/desk_snapshot.json?ts='+Date.now(),{cache:'no-store'});if(r.ok){D=await r.json();render();}}catch(_){}}
nav();render();setInterval(poll,15000);
</script></body></html>
