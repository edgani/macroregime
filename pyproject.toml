[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eros-os"
version = "0.1.0"
description = "Global economic reasoning and capital allocation operating system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<2",
  "networkx>=3.4,<4",
  "pandas>=2.3,<3",
  "pyarrow>=21,<24",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "streamlit>=1.48,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pandas-stubs>=2.3,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-networkx>=3.4,<4",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eros"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: requires network access"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["eros"]
