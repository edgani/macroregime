<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>War Room OS V10.0</title>
<style>
:root{--bg:#050811;--panel:#0b1324;--panel2:#0f1b31;--line:#223653;--text:#edf5ff;--muted:#93a8c2;--faint:#607896;--cyan:#58ddff;--green:#42e49b;--amber:#ffd166;--red:#ff6688;--blue:#8fb0ff;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;--sans:Inter,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% -10%,#11284c 0,#050811 43%);color:var(--text);font-family:var(--sans)}button,select{font:inherit}.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:#050914f5;padding:20px 12px}.brand{padding:5px 9px 20px}.brand h1{margin:0;font:900 18px var(--mono);letter-spacing:.08em}.brand b{color:var(--cyan)}.brand p{margin:9px 0 0;color:var(--muted);font-size:11px;line-height:1.55}.nav{display:grid;gap:6px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:11px;border-radius:9px;text-align:left;font:750 11px var(--mono);cursor:pointer}.nav button:hover,.nav button.active{background:var(--panel2);border-color:var(--line);color:var(--text)}.main{min-width:0;padding:18px 18px 44px}.top{position:sticky;top:8px;z-index:20;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#071020ec;backdrop-filter:blur(10px);padding:12px 14px;border-radius:11px}.title{font:900 14px var(--mono)}.chip{margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font:800 10px var(--mono)}.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-top:12px}.card{border:1px solid var(--line);background:linear-gradient(180deg,#0e192fef,#080f1def);border-radius:11px;padding:15px;min-width:0}.eyebrow{font:850 9px var(--mono);letter-spacing:.14em;color:var(--faint)}h2{margin:7px 0 8px;font:900 23px var(--sans);line-height:1.25}h3{margin:7px 0 8px;font:900 15px var(--sans)}.lead{color:var(--muted);font-size:13px;line-height:1.58}
.jarvis{border:1px solid var(--green);background:linear-gradient(180deg,rgba(66,228,155,.07),transparent)}
.jline{color:var(--text);font-size:15px;line-height:1.65;margin:7px 0;padding-left:14px;position:relative}
.jline:before{content:"▸";position:absolute;left:0;color:var(--green)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-top:12px}.metric{border:1px solid #1b3150;background:#071020;border-radius:9px;padding:11px;min-width:0}.metric span{display:block;color:var(--faint);font:800 9px var(--mono);letter-spacing:.07em}.metric b{display:block;margin-top:5px;font:900 16px var(--mono);overflow-wrap:anywhere}.section{margin-top:12px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.info{color:var(--cyan)}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font:800 9px var(--mono);white-space:nowrap}.pill.good{border-color:#1e6d50}.pill.warn{border-color:#745e2a}.pill.bad{border-color:#743049}.list{display:grid;gap:8px}.item{border:1px solid #1a2e4a;background:#071020;border-radius:8px;padding:11px}.item b{font:850 11px var(--mono)}.item p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.5;overflow-wrap:anywhere}.action{border-left:4px solid var(--faint)}.action.long{border-left-color:var(--green)}.action.short{border-left-color:var(--red)}.action.watch{border-left-color:var(--amber)}.action button{float:right;border:1px solid var(--line);background:#0c1a32;color:var(--cyan);padding:7px 9px;border-radius:7px;font:800 10px var(--mono);cursor:pointer}.selectbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.selectbar label{color:var(--faint);font:800 10px var(--mono)}select{min-width:280px;background:#071020;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px}.packet{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:12px;margin-top:12px}.packet-main,.packet-side{display:grid;gap:12px;align-content:start}.audit{width:100%;border-collapse:collapse;font-size:11px}.audit th,.audit td{padding:9px;border-bottom:1px solid #1a2e4a;text-align:left;vertical-align:top}.audit th{color:var(--faint);font:850 9px var(--mono);letter-spacing:.08em}.bar{height:8px;background:#061020;border:1px solid #1a2e4a;border-radius:999px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green))}.step{display:grid;grid-template-columns:32px 1fr;gap:9px;border:1px solid #1a2e4a;background:#071020;padding:10px;border-radius:8px}.step em{width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--cyan);font:850 10px var(--mono);font-style:normal}.step b{font:800 11px var(--mono)}.step p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.45}.empty{border:1px dashed var(--line);padding:18px;border-radius:9px;text-align:center;color:var(--muted)}details{border:1px solid var(--line);border-radius:10px;background:#071020;padding:0 12px}summary{cursor:pointer;padding:12px 0;color:var(--cyan);font:850 11px var(--mono)}details>div{padding-bottom:12px}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.statusbox{border:1px solid #1a2e4a;background:#071020;border-radius:8px;padding:10px}.statusbox span{display:block;color:var(--faint);font:800 9px var(--mono)}.statusbox b{display:block;margin-top:5px;font:900 12px var(--mono);overflow-wrap:anywhere}.foot{margin-top:16px;color:var(--faint);font:10px var(--mono);line-height:1.6}
@media(max-width:1150px){.metrics{grid-template-columns:repeat(3,1fr)}.grid3{grid-template-columns:1fr 1fr}.packet{grid-template-columns:1fr}}@media(max-width:820px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,1fr)}.main{padding:12px}.top{position:relative;top:0}.hero,.grid2,.grid3{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
.lampdot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;box-shadow:0 0 6px currentColor}
</style></head><body><script>/*__INJECT_DATA__*/</script><div class="app"><aside class="side"><div class="brand"><h1>WAR ROOM <b>V10.1</b></h1><p>Current research action, shadow trading, dan systematic live dipisahkan. Setiap ticker memuat thesis → value → target → risk → permission.</p></div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="top"><div class="title" id="pageTitle">MISSION CONTROL</div><div class="chip" id="sync">MEMUAT</div></div><div id="content"></div></main></div>
<script>
const TABS=[['mission','Mission Control'],['macro','Macro & Risk'],['alpha','Alpha Center'],['us','US Stocks'],['idx','IHSG'],['crypto','Crypto'],['commodity','Commodities'],['fx','FX']];let D=window.DASHBOARD_DATA||{},active='mission';const selected={};
const obj=x=>(x&&typeof x==='object'&&!Array.isArray(x))?x:{};const arr=x=>Array.isArray(x)?x:[];const esc=x=>String(x??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const num=x=>Number.isFinite(Number(x))?Number(x):null;const fmt=(x,d=2)=>num(x)!==null?new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(Number(x)):'—';const pct=x=>num(x)!==null?fmt(Number(x)*100,2)+'%':'—';
function tone(s){s=String(s||'').toUpperCase();if(/ELIGIBLE|ACTIVE|AVAILABLE|FRESH|VALID|LONG_BIAS/.test(s)&&!/NOT_|INVALID|PROOF_GATED/.test(s))return'good';if(/SHORT_BIAS|AVOID|ERROR|INVALID/.test(s))return'bad';return'warn'}function clsDirection(d){return d==='LONG_BIAS'?'long':d==='SHORT_BIAS'?'short':'watch'}function metric(l,v,c=''){return `<div class="metric"><span>${esc(l)}</span><b class="${c}">${esc(v)}</b></div>`}function metricRaw(l,v,c=''){return `<div class="metric"><span>${l}</span><b class="${c}">${esc(v)}</b></div>`}
const LAMPC={LIVE_JUST_STARTED:'#8fb0ff',LIVE:'#42e49b',PREPARING:'#ffd166',NOT_READY:'#ff6688'};
function lamp(lc){const s=String(obj(lc).state||'NOT_READY');return `<span class="lampdot" style="background:${LAMPC[s]||'#607896'}" title="${esc(obj(lc).label_id||s)}"></span>`}
function lampBig(lc){const s=String(obj(lc).state||'NOT_READY');return `<span class="lampdot" style="background:${LAMPC[s]||'#607896'};width:13px;height:13px"></span>`}
function nav(){document.getElementById('nav').innerHTML=TABS.map(([id,l])=>`<button class="${id===active?'active':''}" onclick="go('${id}')">${esc(l)}</button>`).join('')}function go(id){active=id;nav();render();window.scrollTo({top:0,behavior:'smooth'})}function openTicker(m,t){selected[m]=t;go(m)}function setTicker(m,t){selected[m]=t;render()}
function header(k,t,l){const mc=obj(D.mission_control);return `<div class="hero"><div class="card"><div class="eyebrow">${esc(k)}</div><h2>${esc(t)}</h2><div class="lead">${esc(l)}</div></div><div class="card"><div class="eyebrow">PERMISSION LAYERS</div><div class="status-grid"><div class="statusbox"><span>RESEARCH</span><b class="good">${esc(mc.research_permission||'ACTIVE')}</b></div><div class="statusbox"><span>SHADOW</span><b class="${tone(mc.shadow_permission)}">${esc(mc.shadow_permission||'WATCH_ONLY')}</b></div><div class="statusbox"><span>SYSTEMATIC LIVE</span><b class="${tone(mc.systematic_live_permission)}">${esc(mc.systematic_live_permission||'PROOF_GATED')}</b></div></div><div class="lead" style="margin-top:9px">${esc(mc.decision||'REFRESH_CURRENT_CONTEXT')}</div></div></div>`}
function actionItem(p){const a=obj(p.current_action),d=a.direction||'WATCH',tf=obj(p.thesis_frame),lc=obj(p.thesis_lifecycle);return `<div class="item action ${clsDirection(d)}"><button onclick="openTicker('${esc(p.market)}','${esc(p.ticker)}')">Open</button><b>${lamp(lc)} ${esc(p.market_label)} · ${esc(p.ticker)} · <span class="${tone(d)}">${esc(d)}</span></b><p>Thesis <b>${esc(lc.label_id||'—')}</b> · proyeksi <b>${fmt(tf.projection_price,2)}</b>${Array.isArray(tf.projection_range)?' ('+fmt(tf.projection_range[0],0)+'–'+fmt(tf.projection_range[1],0)+')':''} · invalidasi <b>${fmt(tf.invalidation_price,2)}</b> · horizon ${esc(tf.horizon_days||'—')}D<br>Score ${fmt(a.score,3)} · confidence ${pct(a.confidence)} · quality ${esc(a.data_quality||0)}/100 · shadow ${esc(obj(a.permissions).shadow_trading)}</p></div>`}
function marketSummary(m){const row=obj(obj(D.markets)[m]),packets=Object.values(obj(obj(D.ticker_packets)[m])),bias=packets.filter(p=>['LONG_BIAS','SHORT_BIAS'].includes(obj(p.current_action).direction)).length,shadow=packets.filter(p=>obj(obj(p.current_action).permissions).shadow_trading==='ELIGIBLE').length;return `<div class="card"><div class="eyebrow">${esc(row.label||m)}</div><h3>${bias} current bias · ${shadow} shadow</h3><div class="lead">Packets ${packets.length} · current quotes ${row.current_quote_count||0}<br>Research ${esc(row.research_permission||'ACTIVE')} · live ${esc(row.systematic_live_permission||'PROOF_GATED')}</div></div>`}
function intelStrip(){const mi=obj(D.market_intelligence);if(mi.state!=='CURRENT')return '';const q=obj(mi.macro_quad),reg=obj(mi.regime_state),cm=obj(mi.crash_meter),cc=obj(mi.cycle_compass),xa=obj(mi.cross_asset),rr=obj(mi.risk_regime);return `<div class="metrics">${metric('Structural',reg.structural||'—','info')}${metric('Monthly',reg.monthly||'—','info')}${metric('Macro Quad (fwd)',q.quad||'—','info')}${metric('Risk regime',rr.verdict||'—')}${metric('Compass',cc.compass||'—','info')}${metric('X-Asset',xa.regime||'—')}${metric('Crash meter',(num(cm.value)!==null?fmt(cm.value,0):'—')+' '+(cm.severity||''))}${metric('HMM / Shock',(mi.hmm_state||'—')+' / '+(mi.shock_state||'—'))}</div>`}
function lifecycleStrip(){const cnt={LIVE_JUST_STARTED:0,LIVE:0,PREPARING:0,NOT_READY:0};['us','idx','crypto','commodity','fx'].forEach(m=>Object.values(obj(obj(D.ticker_packets)[m])).forEach(p=>{const s=obj(p.thesis_lifecycle).state||'NOT_READY';cnt[s]=(cnt[s]||0)+1}));const dot=s=>`<span class="lampdot" style="background:${LAMPC[s]}"></span>`;return `<div class="metrics">${metricRaw(dot('LIVE_JUST_STARTED')+' BARU JALAN',cnt.LIVE_JUST_STARTED,'good')}${metricRaw(dot('LIVE')+' SUDAH JALAN',cnt.LIVE,'good')}${metricRaw(dot('PREPARING')+' SIAP-SIAP',cnt.PREPARING,'info')}${metricRaw(dot('NOT_READY')+' BELUM SIAP',cnt.NOT_READY,'warn')}</div>`}
function jarvisPanel(){const b=arr(D.jarvis_brief);if(!b.length)return '';return `<div class="card section jarvis"><div class="eyebrow">JARVIS — RINGKASAN HARI INI</div><div class="lead" style="margin-bottom:8px">Dibaca atas ke bawah, 30 detik selesai. Semua kalimat diambil dari data nyata; kalau datanya tidak ada, kalimatnya tidak ditulis.</div>${b.map(x=>`<p class="jline">${esc(x)}</p>`).join('')}</div>`}
function mission(){const mc=obj(D.mission_control),ac=obj(D.alpha_center),shadow=arr(ac.shadow_candidates).slice(0,10),bias=arr(ac.research_biases).slice(0,10);return header('MISSION CONTROL','Bukan semua blocked: output riset, shadow, dan live punya izin berbeda',mc.plain_language||'')+jarvisPanel()+intelStrip()+lifecycleStrip()+`<div class="metrics">${metric('Bundled data',mc.bundled_datasets_present||0,'good')}${metric('Fresh quote markets',(mc.fresh_quote_markets||0)+'/5',mc.fresh_quote_markets?'good':'warn')}${metric('Research biases',mc.research_biases||0,'info')}${metric('Shadow candidates',mc.shadow_candidates||0,mc.shadow_candidates?'good':'warn')}${metric('Carry state',mc.carry_state||'INCOMPLETE',tone(mc.carry_state))}${metric('Systematic live',mc.systematic_live_permission||'PROOF_GATED','warn')}</div><div class="grid3">${['us','idx','crypto','commodity','fx'].map(marketSummary).join('')}</div><div class="grid2"><div class="card section"><div class="eyebrow">SHADOW-ELIGIBLE NOW</div><div class="list">${shadow.length?shadow.map(actionItem).join(''):'<div class="empty">Belum ada packet yang lolos current quote + value bridge + fixed score + R/R. Jalankan refresh current data.</div>'}</div></div><div class="card section"><div class="eyebrow">CURRENT RESEARCH BIASES</div><div class="list">${bias.length?bias.map(actionItem).join(''):'<div class="empty">Current fundamentals/quote belum cukup. Bundled research tetap tersedia.</div>'}</div></div></div>${dataDrawer()}`}
function carryItem(x){return `<div class="item action ${String(x.current_direction||x.pair_direction||'').includes('LONG')?'long':'short'}"><b>${esc(x.pair)} · ${esc(x.current_direction||x.pair_direction)} · <span class="${tone(x.state)}">${esc(x.state)}</span></b><p>Fund ${esc(x.funding_currency)} → own ${esc(x.target_currency)} · spread ${fmt(x.annual_carry_abs_pct,2)}% · carry score ${fmt(x.carry_score,3)} · unwind ${fmt(x.unwind_risk_score,3)}<br>${esc(x.trade_expression)} · confidence cap ${pct(x.confidence_cap)}</p></div>`}
function riskStrip(){const mi=obj(D.market_intelligence);if(mi.state!=='CURRENT')return '';const fu=obj(mi.funding),cr=obj(mi.crowding),fg=obj(obj(mi.early_warning).fear_greed),cp=obj(mi.crash_pressure),cl=obj(obj(mi.crash_lead).crash_lead),m=obj(mi.meters);const mv=Object.values(m).map(x=>`${esc(x.name)} ${fmt(x.value,0)}`).join(' · ');return `<div class="metrics">${metric('Funding',(fu.label||'—')+' '+fmt(fu.score,0))}${metric('Crowding',(cr.state||'—')+' '+fmt(cr.heat,0))}${metric('Fear/Greed',fmt(fg.value,0)+' '+(fg.state||''))}${metric('Crash pressure',cp.type||'—')}${metric('Crash lead',(cl.risk_level||'—')+(cl.crash_prob?' · 24mo '+Math.round((num(cl.crash_prob['24'])||0)*100)+'%':''))}</div>${mv?`<div class="lead" style="margin:6px 2px">Meters: ${mv}</div>`:''}`}
function macro(){const ms=obj(obj(D.current_action_state).macro_state),rows=obj(obj(D.current_context).macro).series,c=obj(D.carry_trade),top=arr(c.top_carry_trades).slice(0,8),unwind=arr(c.unwind_alerts).slice(0,8);return header('MACRO & RISK','Macro, liquidity, dan carry-trade transmission—bukan pola chart',`Macro ${ms.state||'UNKNOWN'} · carry ${c.state||'INCOMPLETE'} · funding ${arr(c.funding_currencies).join(', ')||'—'} → targets ${arr(c.target_currencies).join(', ')||'—'}`)+riskStrip()+`<div class="metrics">${metric('Growth',fmt(ms.growth_score,3))}${metric('Liquidity',fmt(ms.liquidity_score,3))}${metric('Credit',fmt(ms.credit_score,3))}${metric('Risk assets',fmt(ms.risk_asset_score,3),tone(ms.state))}${metric('Carry state',c.state||'INCOMPLETE',tone(c.state))}</div><div class="grid2"><div class="card section"><div class="eyebrow">TOP CARRY EXPRESSIONS</div><div class="list">${top.length?top.map(carryItem).join(''):'<div class="empty">Policy rates/current quotes belum cukup. Run REFRESH_V101_NOW.bat.</div>'}</div></div><div class="card section"><div class="eyebrow">UNWIND / CROWDING ALERTS</div><div class="list">${unwind.length?unwind.map(carryItem).join(''):'<div class="empty">No admitted unwind alert. Missing basis/positioning still caps confidence.</div>'}</div></div></div><div class="card section"><div class="eyebrow">WHO BENEFITS</div><div class="list">${arr(c.beneficiary_map).slice(0,20).map(x=>`<div class="item"><b>${esc(x.asset)}</b><p>${esc(x.pair)} · ${esc(x.state)}</p></div>`).join('')||'<div class="empty">Carry beneficiary map incomplete.</div>'}</div></div><details class="section"><summary>Macro series details</summary><div><table class="audit"><thead><tr><th>SERIES</th><th>VALUE</th><th>CHANGE 3</th><th>CHANGE 12</th><th>OBSERVED</th></tr></thead><tbody>${Object.entries(rows).map(([id,x])=>`<tr><td><b>${esc(id)}</b><br><span class="lead">${esc(x.label)}</span></td><td>${fmt(x.value,5)}</td><td>${fmt(x.change_3,5)}</td><td>${fmt(x.change_12,5)}</td><td>${esc(x.observation_timestamp)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Run REFRESH_V101_NOW.bat.</td></tr>'}</tbody></table></div></details>${dataDrawer()}`}
function alpha(){const ac=obj(D.alpha_center),shadow=arr(ac.shadow_candidates),bias=arr(ac.research_biases),watch=arr(ac.research_watchlist).slice(0,30);return header('ALPHA CENTER','Urutan kandidat berdasarkan fixed non-technical score dan kelengkapan current evidence',ac.ranking_basis||'')+`<div class="metrics">${metric('Shadow eligible',shadow.length,shadow.length?'good':'warn')}${metric('Research bias',bias.length,'info')}${metric('Watch',ac.research_watchlist_total||watch.length,'warn')}${metric('Systematic promoted',arr(ac.promoted).length,'warn')}${metric('Auto submit','OFF','good')}</div><div class="grid2"><div class="card section"><div class="eyebrow">SHADOW CANDIDATES</div><div class="list">${shadow.length?shadow.map(actionItem).join(''):'<div class="empty">None yet.</div>'}</div></div><div class="card section"><div class="eyebrow">RESEARCH BIASES</div><div class="list">${bias.length?bias.map(actionItem).join(''):'<div class="empty">None yet.</div>'}</div></div></div><div class="card section"><div class="eyebrow">WATCHLIST</div><div class="list">${watch.map(actionItem).join('')}</div></div>`}
function componentRows(a){return Object.entries(obj(a.components)).map(([k,v])=>`<tr><td>${esc(k.replaceAll('_',' '))}</td><td>${fmt(v,3)}</td><td><div class="bar"><i style="width:${Math.max(0,Math.min(100,50+(num(v)||0)*50))}%"></i></div></td></tr>`).join('')}
function researchBlocks(p){const r=obj(p.research_context),blocks=[];arr(r.chains).slice(0,3).forEach(c=>blocks.push(`<div class="item"><b>${esc(c.name)} · ${esc(c.role)}</b><p>${esc(c.mechanism||c.rationale)}<br>Status ${esc(c.trigger_status)} · horizon ${esc(c.horizon)}</p></div>`));if(obj(r.bottleneck_reference).role)blocks.push(`<div class="item"><b>Bottleneck: ${esc(r.bottleneck_reference.role)}</b><p>Priority ${esc(r.bottleneck_reference.priority)} · ${esc(r.bottleneck_reference.target)} · research reference only.</p></div>`);arr(r.idx_groups).slice(0,2).forEach(g=>blocks.push(`<div class="item"><b>Controller/group: ${esc(g.group_id)}</b><p>${esc(g.patriarch)} · ${esc(g.holding)}</p></div>`));return blocks.join('')||'<div class="empty">No ticker-specific bundled causal reference.</div>'}
function projectionTable(a){const p=obj(a.projection);return p.valid?`<table class="audit"><tbody><tr><td>Current</td><td>${fmt(p.current_price,6)}</td></tr><tr><td>Low</td><td>${fmt(p.target_low,6)}</td></tr><tr><td>Base</td><td>${fmt(p.target_base,6)}</td></tr><tr><td>High</td><td>${fmt(p.target_high,6)}</td></tr><tr><td>Expected</td><td>${fmt(p.expected_target_price,6)}</td></tr><tr><td>Expected return</td><td>${pct(p.expected_return)}</td></tr><tr><td>Horizon</td><td>${esc(p.horizon_days)} days</td></tr><tr><td>Calibration</td><td class="warn">${esc(p.calibration_state)}</td></tr></tbody></table><div class="lead" style="margin-top:8px">${esc(p.claim_limit)}</div>`:`<div class="empty">${esc(p.reason||p.state||'Current value bridge incomplete.')}</div>`}
function carryPacket(p){const c=obj(p.carry_trade);if(!c.pair)return'';return `<div class="card"><div class="eyebrow">CARRY TRADE MAP</div><div class="status-grid"><div class="statusbox"><span>STATE</span><b class="${tone(c.state)}">${esc(c.state)}</b></div><div class="statusbox"><span>FUNDING</span><b>${esc(c.funding_currency)}</b></div><div class="statusbox"><span>TARGET</span><b>${esc(c.target_currency)}</b></div></div><table class="audit"><tbody><tr><td>Carry direction</td><td>${esc(c.carry_direction||c.pair_direction)}</td></tr><tr><td>Current direction</td><td>${esc(c.current_direction)}</td></tr><tr><td>Stage / action</td><td>${esc(c.stage)} · ${esc(c.recommended_action)}</td></tr><tr><td>Rate spread</td><td>${fmt(c.rate_spread_pct,2)}%</td></tr><tr><td>Carry score</td><td>${fmt(c.carry_score,3)}</td></tr><tr><td>Unwind risk</td><td>${fmt(c.unwind_risk_score,3)}</td></tr><tr><td>Confidence cap</td><td>${pct(c.confidence_cap)}</td></tr></tbody></table><div class="item" style="margin-top:8px"><b>Beneficiaries</b><p>${arr(c.beneficiaries).map(esc).join(' · ')||'Incomplete'}</p></div><div class="item" style="margin-top:8px"><b>At risk / invalidation</b><p>${arr(c.at_risk).map(esc).join(' · ')}<br>${arr(c.invalidation).map(esc).join(' · ')}</p></div><div class="lead" style="margin-top:8px">${esc(c.claim_limit)}</div></div>`}
function packetView(p){const a=obj(p.current_action),perm=obj(a.permissions),risk=obj(a.risk_plan),q=obj(a.quote_state),proof=obj(p.proof_data),lc=obj(p.thesis_lifecycle),tf=obj(p.thesis_frame);return `<div class="packet"><div class="packet-main"><div class="card"><div class="eyebrow">CURRENT DECISION</div><div class="status-grid"><div class="statusbox"><span>ACTION</span><b class="${tone(a.direction)}">${esc(a.direction||'WATCH')}</b></div><div class="statusbox"><span>SHADOW</span><b class="${tone(perm.shadow_trading)}">${esc(perm.shadow_trading||'WATCH_ONLY')}</b></div><div class="statusbox"><span>SYSTEMATIC LIVE</span><b class="warn">${esc(perm.systematic_live||'PROOF_GATED')}</b></div></div><div class="metrics">${metric('Score',fmt(a.score,3))}${metric('Confidence',pct(a.confidence))}${metric('Data quality',(a.data_quality||0)+'/100')}${metric('Quote',q.state||'MISSING',tone(q.state))}${metric('Price',fmt(q.price,6))}</div><div class="item" style="margin-top:10px"><b>Why now</b><p>${arr(a.reasons).map(esc).join(' · ')||'Current evidence incomplete.'}</p></div><div class="item" style="margin-top:8px"><b>Remaining gates</b><p>${arr(a.blockers).map(esc).join(' · ')||'None'}</p></div></div><div class="card"><div class="eyebrow">DECISION COMPONENTS</div><table class="audit"><thead><tr><th>DOMAIN</th><th>SCORE</th><th>RELATIVE</th></tr></thead><tbody>${componentRows(a)}</tbody></table></div><div class="card"><div class="eyebrow">CAUSAL / BOTTLENECK CONTEXT</div><div class="list">${researchBlocks(p)}</div></div><div class="card"><div class="eyebrow">CAUSAL SEQUENCE</div><div class="list">${arr(p.causal_chain).map(x=>`<div class="step"><em>${esc(x.step)}</em><div><b>${esc(x.name)}</b><p>${esc(x.state)} · ${esc(x.note||'Not mapped')}</p></div></div>`).join('')}</div></div></div><div class="packet-side"><div class="card"><div class="eyebrow">THESIS LIFECYCLE</div><h3>${lampBig(lc)} ${esc(lc.label_id||'—')}</h3><div class="lead">Status operasional thesis dari evidence gates — bukan sinyal chart. Dilacak sejak ${esc(lc.tracked_since||'—')}.</div>${arr(lc.advance_blockers).length?`<div class="item" style="margin-top:8px"><b>Belum naik level karena</b><p>${arr(lc.advance_blockers).map(esc).join(' · ')}</p></div>`:''}</div><div class="card"><div class="eyebrow">THESIS → PROYEKSI → INVALIDASI</div><table class="audit"><tbody><tr><td>Proyeksi (base)</td><td><b>${fmt(tf.projection_price,2)}</b></td></tr><tr><td>Range skenario</td><td>${Array.isArray(tf.projection_range)?fmt(tf.projection_range[0],2)+' – '+fmt(tf.projection_range[1],2):'—'}</td></tr><tr><td>Basis</td><td>${esc(tf.projection_basis||'—')}</td></tr><tr><td>Horizon</td><td>${esc(tf.horizon_days||'—')} hari</td></tr><tr><td>Invalidasi harga</td><td><b>${fmt(tf.invalidation_price,2)}</b> <span class="lead">(${esc(tf.invalidation_price_basis||'—')})</span></td></tr></tbody></table><div class="lead" style="margin-top:8px">${esc(tf.invalidation_text||'')}</div><div class="lead">${esc(tf.claim_limit||'')}</div><details style="margin-top:8px"><summary>Research order plan (referensi manual — bukan rekomendasi entry)</summary><table class="audit"><tbody><tr><td>Side</td><td>${esc(risk.side)}</td></tr><tr><td>Entry</td><td>${fmt(risk.entry,6)}</td></tr><tr><td>Stop</td><td>${fmt(risk.stop,6)}</td></tr><tr><td>Target</td><td>${fmt(risk.target,6)}</td></tr><tr><td>Reward/Risk</td><td>${fmt(risk.reward_risk,2)}</td></tr><tr><td>Risk budget</td><td>${fmt(risk.risk_budget,2)}</td></tr><tr><td>Quantity</td><td>${fmt(risk.quantity,6)}</td></tr><tr><td>Notional</td><td>${fmt(risk.notional,2)}</td></tr></tbody></table><div class="lead" style="margin-top:8px">${esc(risk.invalidation)}</div></details></div><div class="card"><div class="eyebrow">TICKER-BOUND PROJECTION</div><h3>${esc(obj(a.projection).state||'INCOMPLETE')}</h3>${projectionTable(a)}</div>${carryPacket(p)}<div class="card"><div class="eyebrow">PROOF & EXECUTION</div><table class="audit"><tbody><tr><td>Research action</td><td class="good">${esc(perm.research_action)}</td></tr><tr><td>Shadow</td><td class="${tone(perm.shadow_trading)}">${esc(perm.shadow_trading)}</td></tr><tr><td>Systematic live</td><td class="warn">${esc(perm.systematic_live)}</td></tr><tr><td>Manual experimental</td><td>${esc(perm.experimental_manual)}</td></tr><tr><td>Auto-submit</td><td class="good">OFF</td></tr><tr><td>Bound proof</td><td>${proof.market_proof_valid?'VALID':'PENDING'}</td></tr></tbody></table></div></div></div>`}
function marketPage(m){const row=obj(obj(D.markets)[m]),packets=obj(obj(D.ticker_packets)[m]),tickers=Object.keys(packets);if(!selected[m]||!packets[selected[m]])selected[m]=tickers[0]||'';const p=obj(packets[selected[m]]);return header((row.label||m).toUpperCase(),'Satu ticker = thesis + current action + projection + risk + permission',`Research context ${row.research_data_status||'UNKNOWN'} · current quotes ${row.current_quote_count||0}`)+`<div class="metrics">${metric('Packets',tickers.length,'good')}${metric('Research actions',row.research_actions||0,'info')}${metric('Shadow candidates',row.shadow_candidates||0,row.shadow_candidates?'good':'warn')}${metric('Research permission',row.research_permission||'ACTIVE','good')}${metric('Systematic live',row.systematic_live_permission||'PROOF_GATED','warn')}</div><div class="card section"><div class="selectbar"><label>TICKER</label><select onchange="setTicker('${m}',this.value)">${tickers.map(t=>`<option ${t===selected[m]?'selected':''} value="${esc(t)}">${esc(t)}</option>`).join('')}</select><span class="pill ${tone(obj(p.current_action).direction)}">${esc(obj(p.current_action).direction||'WATCH')}</span><span class="pill ${tone(obj(obj(p.current_action).permissions).shadow_trading)}">SHADOW ${esc(obj(obj(p.current_action).permissions).shadow_trading||'WATCH_ONLY')}</span></div></div>${tickers.length?packetView(p):'<div class="empty section">No packets.</div>'}${dataDrawer()}`}
function dataDrawer(){const cc=obj(D.current_context),m=obj(cc.manifest),inv=obj(obj(D.bundled_research).inventory);return `<details class="section"><summary>Data & Proof details</summary><div class="metrics">${metric('Bundled present',inv.datasets_present||0,'good')}${metric('Bundled loaded',inv.datasets_loaded||0,'good')}${metric('Current quotes',obj(cc.quotes).quote_count||0)}${metric('Fundamentals',obj(cc.fundamentals).record_count||0)}${metric('Macro series',obj(cc.macro).series_count||0)}</div><div class="lead" style="margin-top:9px">Current manifest: ${esc(m.generated_at||'not refreshed')} · acquisition completeness is not profitability proof.</div></details>`}
function render(){document.getElementById('pageTitle').textContent=(TABS.find(x=>x[0]===active)?.[1]||'WAR ROOM').toUpperCase();const views={mission,macro,alpha,us:()=>marketPage('us'),idx:()=>marketPage('idx'),crypto:()=>marketPage('crypto'),commodity:()=>marketPage('commodity'),fx:()=>marketPage('fx')};document.getElementById('content').innerHTML=(views[active]||mission)()+`<div class="foot">V10.1 CARRY-AWARE OPERATIONAL RESEARCH + SHADOW TRADING · NO CHART-DERIVED DECISION INPUTS · LIVE SYSTEMATIC REMAINS EXACT-PROOF GATED · AUTO-SUBMIT OFF · GENERATED ${esc(obj(D.meta).generated)}</div>`;const mc=obj(D.mission_control);document.getElementById('sync').innerHTML=`RESEARCH <span class="good">${esc(mc.research_permission||'ACTIVE')}</span> · SHADOW <span class="${tone(mc.shadow_permission)}">${esc(mc.shadow_permission||'WATCH_ONLY')}</span> · LIVE <span class="warn">${esc(mc.systematic_live_permission||'PROOF_GATED')}</span>`}
async function poll(){try{const r=await fetch('static/desk_snapshot.json?ts='+Date.now(),{cache:'no-store'});if(r.ok){D=await r.json();render()}}catch(_){}}nav();render();setInterval(poll,15000);
</script></body></html>
